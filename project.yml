name: Mochlet
options:
  bundleIdPrefix: com.ilexpwh
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SlimeKit:
    path: Packages/SlimeKit
  MochletCore:
    path: Packages/MochletCore

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      # Ad-hoc signing keeps a stable identity for TCC prompts during development.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Mochlet:
    build:
      targets:
        Mochlet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MochletTests
    archive:
      config: Release

targets:
  Mochlet:
    type: application
    platform: macOS
    sources:
      - path: App
        type: group
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Mochlet
        CFBundleDisplayName: Mochlet
        CFBundleIdentifier: com.ilexpwh.Mochlet
        CFBundleVersion: "1"
        CFBundleShortVersionString: "2.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: "Mochlet asks your terminal, browser and editor to show the window you jumped to."
        NSMicrophoneUsageDescription: "Mochlet listens while you hold the slime, and records your side of a meeting you asked it to note."
        NSAudioCaptureUsageDescription: "Mochlet records what your Mac plays only while it notes a meeting, to write down what the others say."
        NSSpeechRecognitionUsageDescription: "Mochlet turns your voice into text on this Mac."
        NSAccessibilityUsageDescription: "Mochlet reads the title of the window you drop the slime on, to attach it as context."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ilexpwh.Mochlet
            CFBundleURLSchemes:
              - mochlet
    entitlements:
      path: Mochlet.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilexpwh.Mochlet
        PRODUCT_NAME: Mochlet
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Mochlet.entitlements
    dependencies:
      - package: SlimeKit
        product: SlimeKit
      - package: SlimeKit
        product: SlimeKitUI
      - package: SlimeKit
        product: SlimeKitAudio
      - package: MochletCore
        product: MochletCore
      - package: MochletCore
        product: MochletServices
    postBuildScripts:
      - name: "Record git hash"
        script: |
          HASH=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :MochletGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :MochletGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false
        basedOnDependencyAnalysis: false

  MochletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/App
    dependencies:
      - target: Mochlet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilexpwh.MochletTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mochlet.app/Contents/MacOS/Mochlet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
